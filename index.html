<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:1000px;
    background:white;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    overflow:hidden;
}

.header{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.content{
    padding:30px;
}

#dashboard{
    display:none;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.logout{
    background:#dc2626;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#f3f4f6;
    border-radius:8px;
    padding:15px;
}

.card b{
    color:#2563eb;
}

.section-title{
    margin-top:20px;
    margin-bottom:10px;
    color:#2563eb;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:25px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tfoot td{
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.summary .box{
    background:#eef4ff;
    border-left:5px solid #2563eb;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.summary h3{
    color:#2563eb;
    margin-bottom:10px;
}

#status{
    font-size:20px;
    font-weight:bold;
}

.paid{
    color:green;
}

.unpaid{
    color:red;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}
/* ================= MOBILE VIEW ================= */

@media screen and (max-width:768px){

body{
    padding:10px;
    align-items:flex-start;
}

.container{
    width:100%;
    border-radius:8px;
}

.content{
    padding:15px;
}

.header h1{
    font-size:22px;
}

.info{
    grid-template-columns:1fr;
}

table{
    font-size:13px;
    display:block;
    overflow-x:auto;
    white-space:nowrap;
}

th,
td{
    padding:8px;
}

.summary{
    grid-template-columns:1fr;
}

button{
    font-size:15px;
}

input{
    font-size:15px;
}

}

/* Extra Small Phones */

@media screen and (max-width:480px){

.header h1{
    font-size:18px;
}

h2{
    font-size:20px;
}

.card{
    padding:12px;
}

.info .card{
    padding:12px;
}

th,
td{
    font-size:12px;
    padding:6px;
}

.summary .box{
    padding:10px;
}

button{
    padding:10px;
}

input{
    padding:10px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>LOAN MANAGEMENT SYSTEM</h1>

</div>

<div class="content">

<!-- LOGIN -->

<div id="login">

<h2 style="text-align:center;margin-bottom:20px;">LOGIN</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">

LOGIN

</button>

<p id="error"></p>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="info">

<div class="card">
<b>Name</b><br>
<span id="fullname"></span>
</div>

<div class="card">
<b>Birthday</b><br>
<span id="birthday"></span>
</div>

<div class="card">
<b>Address</b><br>
<span id="address"></span>
</div>

<div class="card">
<b>Loan Date</b><br>
<span id="loanDate"></span>
</div>

</div>

<h2 class="section-title">

Loan Information

</h2>

<table>

<thead>

<tr>

<th>Principal</th>

<th>Interest</th>

<th>Total Loan</th>

<th>Months</th>

<th>Due Date</th>

</tr>

</thead>

<tbody id="loanTable">

</tbody>

</table>

<h2 class="section-title">

Payment History

</h2>

<table>

<thead>

<tr>

<th>Date</th>

<th>Payment</th>

</tr>

</thead>

<tbody id="paymentTable">

</tbody>

<tfoot>

<tr>

<td>Total Payment</td>

<td id="totalPayment"></td>

</tr>

</tfoot>

</table>

<div class="summary">

<div class="box">

<h3>Current Balance</h3>

<div id="balance"></div>

</div>

<div class="box">

<h3>Status</h3>

<div id="status"></div>

</div>

<div class="box">

<h3>Loan Period</h3>

<div>3 Months</div>

</div>

</div>

<button class="logout" onclick="logout()">

Logout

</button>

</div>

</div>

</div>

<script>

const users = [

{
    username:"Vanessa",
    password:"Vanessa",

    name:"Czyra Vanessa Pasion",
    address:"Sta. Cruz, Gonzaga, Cagayan",
    birthday:"October 23, 1996",

    loans:[
    {
        principal:4095.32,
        loanDate:"2026-11-14"
    }
    ],

    payments:[
    {
        date:"2026-09-14",
        amount:0
    },
    {
        date:"2026-08-14",
        amount:0
    }
    ]

},

{
    username:"juan",
    password:"loan123",

    name:"Juan Dela Cruz",
    address:"Lal-lo, Cagayan",
    birthday:"March 20, 1998",

    loans:[
    {
        principal:30000,
        loanDate:"2026-04-10"
    }
    ],

    payments:[
    {
        date:"2026-05-10",
        amount:5000
    }
    ]

}

];

function peso(value){

return "₱"+value.toLocaleString("en-PH",{
minimumFractionDigits:2,
maximumFractionDigits:2
});

}

function formatDate(date){

return date.toLocaleDateString("en-PH",{
year:"numeric",
month:"long",
day:"numeric"
});

}

function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value.trim();

const account=users.find(u=>u.username===username && u.password===password);

if(!account){

document.getElementById("error").innerHTML="Invalid Username or Password";
return;

}

document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";

document.getElementById("fullname").textContent=account.name;
document.getElementById("address").textContent=account.address;
document.getElementById("birthday").textContent=account.birthday;

let loanRows="";
let paymentRows="";

let totalPayment=0;
let currentBalance=0;

account.loans.forEach(loan=>{

const loanDate=new Date(loan.loanDate);

document.getElementById("loanDate").textContent=formatDate(loanDate);

// automatic due date (3 months)

const dueDate=new Date(loanDate);
dueDate.setMonth(dueDate.getMonth()+3);

// bilang ng buwan

const today=new Date();

let months=
(today.getFullYear()-loanDate.getFullYear())*12+
(today.getMonth()-loanDate.getMonth());

if(today.getDate()<loanDate.getDate()){
months--;
}

if(months<0) months=0;

if(months>3) months=3;

// 8% bawat buwan

const interest=loan.principal*(Math.pow(1.08,months)-1);

const totalLoan=loan.principal+interest;

currentBalance=totalLoan;

loanRows+=`
<tr>

<td>${peso(loan.principal)}</td>

<td>${peso(interest)}</td>

<td>${peso(totalLoan)}</td>

<td>${months} / 3</td>

<td>${formatDate(dueDate)}</td>

</tr>
`;

});

account.payments.forEach(payment=>{

totalPayment+=payment.amount;

paymentRows+=`
<tr>

<td>${payment.date}</td>

<td>${peso(payment.amount)}</td>

</tr>
`;

});

document.getElementById("loanTable").innerHTML=loanRows;

document.getElementById("paymentTable").innerHTML=paymentRows;

document.getElementById("totalPayment").innerHTML=peso(totalPayment);

currentBalance-=totalPayment;

if(currentBalance<0)
currentBalance=0;

document.getElementById("balance").innerHTML = peso(currentBalance);

const status = document.getElementById("status");

if(currentBalance <= 0){

    status.innerHTML = "PAID";
    status.className = "paid";

}else{

    status.innerHTML = "UNPAID";
    status.className = "unpaid";

}

}

function logout(){

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "block";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("error").innerHTML = "";

    document.getElementById("loanTable").innerHTML = "";
    document.getElementById("paymentTable").innerHTML = "";
    document.getElementById("totalPayment").innerHTML = "";
    document.getElementById("balance").innerHTML = "";
    document.getElementById("status").innerHTML = "";

}

document.getElementById("password").addEventListener("keypress",function(e){

    if(e.key==="Enter"){
        login();
    }

});

</script>

</body>
</html>
